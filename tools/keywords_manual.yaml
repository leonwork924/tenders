# ---------------------------------------------------------------------------
# Routing. A spreadsheet term matching one of these patterns goes to the named
# group regardless of which column it sat in, because the sheet's columns mix
# subjects (digitisation terms appear under both Records Management and
# Heritage). First match wins; anything unmatched stays in its column's group.
# ---------------------------------------------------------------------------
routing:
  - group: av_media
    match: ["audio", "video", "tape", "subtitl", "voice", "oral history", "band"]
  - group: digitisation
    match: ["digiti", "digitali", "scan", "imaging", "image captur", "ocr",
            "paper to digital", "digital conversion", "data migration",
            "metadata", "indexing"]
  - group: fine_art
    match: ["fine art", "artefact", "artwork"]
  - group: heritage
    match: ["heritage", "monument", "museum", "musem", "manuscript",
            "conservation", "preservation", "restoration", "historical document"]

# ---------------------------------------------------------------------------
# Demotions. These spreadsheet terms are real but far too common in tender text
# to carry a full group weight on their own: "installation", "logistics" and
# "storage" appear in tens of thousands of unrelated notices. They move to the
# support group, where they add a little corroborating weight to a notice that
# already matched something specific, and can't push a notice over the
# threshold by themselves.
# ---------------------------------------------------------------------------
demote:
  - installation
  - logistics
  - storage
  - warehousing
  - packing
  - filing
  - indexing
  - metadata
  - retrieval
  - scanner
  - preservation
  - mobility
  - moving
  - immigration
  - visa
  - work permit
  - travel management
  - assignment management
  - home search
  - freight forwarding
  - cargo handling
  - cargo storage
  - transportation
  - goods transport
  - restauration          # French for catering; see the negative list below

# Terms in the sheet that are typos, ambiguous, or that expand into several
# usable phrases. Left side is what the sheet says, right side is what goes
# into keywords.yaml. An empty list drops the term entirely.
rewrite:
  "mome search": ["home search"]
  "Historial Documents": ["historical document*", "archival document*"]
  "Digitiztion Services": ["digitisation service*", "digitization service*"]
  "Commerical Removals": ["commercial removal*"]
  "Musems,Libraries Archives": ["museum collection*", "library collection*",
                                "archive collection*"]
  "ton band": ["audio tape", "sound tape", "bande son"]
  "video band": ["video tape", "videotape", "bande video"]
  "voice off": ["voice-off", "voix off"]
  "restauration": []      # dropped: French "restauration" means catering
  "subtitle": ["subtitl*"]
  "scanning": ["scanning", "high resolution scanning", "bulk scanning"]
  "filing": ["filing system*", "file management"]
  "Archives": ["archives", "archive service*"]
  "Archiving": ["archiving", "archival storage"]
  "EDMS (Electronic Document Management System)":
    ["edms", "electronic document management"]
  "enterprise content management (ECM)": ["enterprise content management", "ecm"]

# ---------------------------------------------------------------------------
negative:
  weight: -7.0
  terms:
    # "removal" is the worst offender in this sector
    - asbestos removal
    - removal of asbestos
    - waste removal
    - removal of waste
    - snow removal
    - refuse collection
    - graffiti removal
    - removal of graffiti
    - tree removal
    - abattage d'arbre*
    - vehicle removal
    - removal of vehicle*
    - abandoned vehicle*
    - sludge removal
    - clinical waste
    - scrap metal
    - desamiantage
    - enlevement des dechets
    - collecte des dechets
    - deneigement
    - enlevement d'epave*
    - curage
    # "transport" and "mobility" false friends
    - patient transport
    - school transport
    - transport scolaire
    - ambulance
    - urban mobility
    - mobilite urbaine
    - plan de mobilite
    - electric mobility
    - mobility scooter*
    # "restauration" false friend, and the catering family generally
    - restauration collective
    - restauration scolaire
    - service* de restauration
    - catering service*
    # "storage" false friends
    - energy storage
    - battery storage
    - stockage d'energie
    - fuel storage
    # generic IT that "data migration" and "cloud storage" drag in
    - cloud hosting
    - software licence*
    - software license*
    - licences logiciel*

cpv_boost:
  "98392000": 12.0   # Relocation services
  "79995100": 12.0   # Archiving services
  "79999100": 10.0   # Scanning services
  "92522": 8.0       # Preservation of exhibits / historical sites
  "92521": 8.0       # Museum services
  "79995000": 6.0    # Library management
  "45454100": 6.0    # Restoration work
  "63120000": 5.0    # Storage and warehousing
  "39000000": 4.0    # Furniture, furnishings
  "63100000": 4.0    # Cargo handling and storage
  "72312000": 4.0    # Data entry services
  "60000000": 2.0    # Transport services (weak on its own)
  # Added: broader/adjacent codes, useful mainly as a language-independent
  # net for sources whose narrative text isn't in a language the keyword
  # taxonomy covers yet (e.g. Dutch, Croatian) but that still tag CPV
  # correctly, since CPV codes are the same in every language.
  "92512000": 10.0   # Archive services (distinct EU CPV code from 79995100 above)
  "92500000": 5.0    # Library, archive, museum and other cultural services (broad parent)
  "39150000": 5.0    # Miscellaneous furniture and equipment (hotel/office fit-out tenders)
  "39100000": 3.0    # Furniture (general -- weak on its own like 39000000)
  "92311000": 6.0    # Works of art and antiques

# ---------------------------------------------------------------------------
# Buyer-name boost. Foreign ministries and embassies buy exactly the kind of
# work this business does (embassy relocations, diplomatic archives,
# residence furnishing, art in official buildings), so a notice from one of
# these buyers is worth flagging on identity alone -- in whatever language
# it was published in. Terms are matched against the buyer field only, not
# the notice text, and de-accented/lower-cased like everything else.
# ---------------------------------------------------------------------------
buyer_boost:
  # English
  "ministry of foreign affairs": 10.0
  "foreign commonwealth": 10.0
  "foreign office": 8.0
  "department of state": 8.0
  "diplomatic service": 8.0
  "embassy of": 8.0
  "consulate general": 7.0
  "high commission": 7.0
  # French
  "ministere des affaires etrangeres": 10.0
  "ministere de l'europe et des affaires etrangeres": 10.0
  "ambassade de": 8.0
  "ambassade du": 8.0
  "consulat general": 7.0
  # German
  "auswartiges amt": 10.0
  "aussenministerium": 10.0
  "botschaft": 8.0
  # Spanish
  "ministerio de asuntos exteriores": 10.0
  "ministerio de relaciones exteriores": 10.0
  "embajada de": 8.0
  # Italian
  "ministero degli affari esteri": 10.0
  "ambasciata d'italia": 8.0
  "ambasciata italiana": 8.0
  # Portuguese
  "ministerio das relacoes exteriores": 10.0
