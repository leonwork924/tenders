  support:
    weight: 1.5
    terms:
      - entreposage
      - garde-meuble*
      - manutention
      - emballage
      - logistique
      - inventaire
      - conditionnement
      - rayonnage*
      - magasinage
      - transport de mobilier
      - chain of custody
      - climate-controlled
      - mobile shelving
      - palletis*

# ---------------------------------------------------------------------------
# Routing. A spreadsheet term matching one of these patterns goes to the named
# group regardless of which column it sat in, because the sheet's columns mix
# subjects (digitisation terms appear under both Records Management and
# Heritage). First match wins; anything unmatched stays in its column's group.
# ---------------------------------------------------------------------------
routing:
  - group: av_media
    match: ["audio", "video", "tape", "subtitl", "voice", "oral history", "band"]
  - group: digitisation
    match: ["digiti", "digitali", "scan", "imaging", "image captur", "ocr",
            "paper to digital", "digital conversion", "data migration",
            "metadata", "indexing"]
  - group: fine_art
    match: ["fine art", "artefact", "artwork"]
  - group: heritage
    match: ["heritage", "monument", "museum", "musem", "manuscript",
            "conservation", "preservation", "restoration", "historical document"]

# ---------------------------------------------------------------------------
# Demotions. These spreadsheet terms are real but far too common in tender text
# to carry a full group weight on their own: "installation", "logistics" and
# "storage" appear in tens of thousands of unrelated notices. They move to the
# support group, where they add a little corroborating weight to a notice that
# already matched something specific, and can't push a notice over the
# threshold by themselves.
# ---------------------------------------------------------------------------
demote:
  - installation
  - logistics
  - storage
  - warehousing
  - packing
  - filing
  - indexing
  - metadata
  - retrieval
  - scanner
  - preservation
  - mobility
  - moving
  - immigration
  - visa
  - work permit
  - travel management
  - assignment management
  - home search
  - freight forwarding
  - cargo handling
  - cargo storage
  - transportation
  - goods transport
  - restauration          # French for catering; see the negative list below

# Terms in the sheet that are typos, ambiguous, or that expand into several
# usable phrases. Left side is what the sheet says, right side is what goes
# into keywords.yaml. An empty list drops the term entirely.
rewrite:
  "mome search": ["home search"]
  "Historial Documents": ["historical document*", "archival document*"]
  "Digitiztion Services": ["digitisation service*", "digitization service*"]
  "Commerical Removals": ["commercial removal*"]
  "Musems,Libraries Archives": ["museum collection*", "library collection*",
                                "archive collection*"]
  "ton band": ["audio tape", "sound tape", "bande son"]
  "video band": ["video tape", "videotape", "bande video"]
  "voice off": ["voice-off", "voix off"]
  "restauration": []      # dropped: French "restauration" means catering
  "subtitle": ["subtitl*"]
  "scanning": ["scanning", "high resolution scanning", "bulk scanning"]
  "filing": ["filing system*", "file management"]
  "Archives": ["archives", "archive service*"]
  "Archiving": ["archiving", "archival storage"]
  "EDMS (Electronic Document Management System)":
    ["edms", "electronic document management"]
  "enterprise content management (ECM)": ["enterprise content management", "ecm"]

# ---------------------------------------------------------------------------
negative:
  weight: -7.0
  terms:
    # "removal" is the worst offender in this sector
    - asbestos removal
    - removal of asbestos
    - waste removal
    - removal of waste
    - snow removal
    - refuse collection
    - graffiti removal
    - removal of graffiti
    - tree removal
    - abattage d'arbre*
    - vehicle removal
    - removal of vehicle*
    - abandoned vehicle*
    - sludge removal
    - clinical waste
    - scrap metal
    - desamiantage
    - enlevement des dechets
    - collecte des dechets
    - deneigement
    - enlevement d'epave*
    - curage
    # "transport" and "mobility" false friends
    - patient transport
    - school transport
    - transport scolaire
    - ambulance
    - urban mobility
    - mobilite urbaine
    - plan de mobilite
    - electric mobility
    - mobility scooter*
    # "restauration" false friend, and the catering family generally
    - restauration collective
    - restauration scolaire
    - service* de restauration
    - catering service*
    # "storage" false friends
    - energy storage
    - battery storage
    - stockage d'energie
    - fuel storage
    # generic IT that "data migration" and "cloud storage" drag in
    - cloud hosting
    - software licence*
    - software license*
    - licences logiciel*

