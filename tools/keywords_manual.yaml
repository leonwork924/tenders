# Hand-maintained keyword layer.
#
# import_keywords.py merges this with the spreadsheet and writes keywords.yaml.
# The spreadsheet is English (plus a little German); everything French lives
# here, along with the negative list, the CPV boosts, and the rules that decide
# which group a spreadsheet term lands in.
#
# Write terms WITHOUT accents. Text is de-accented before matching, so
# "numerisation" catches "numérisation". "*" is a suffix wildcard.

