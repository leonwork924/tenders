name: leads (moving intelligence)

on:
  schedule:
    # Lundi matin -- suppose que la newsletter de la semaine a déjà été
    # déposée (processus manuel séparé, voir NEWSLETTER_HOWTO.md). Si ce
    # n'est pas encore le cas au moment du run, celui-ci travaillera juste
    # sur l'édition précédente -- pas d'erreur, juste moins à jour.
    - cron: "5 7 * * 1"   # lundi 07:05 UTC
  workflow_dispatch: {}   # pour lancer à la main depuis l'onglet Actions

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r leads/requirements.txt

      - name: Score prospects from this week's newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python leads/run_weekly.py \
            --newsletter site/newsletter.json \
            --icp leads/icp.yaml \
            --out site/prospects.json

      - name: Commit updated data
        run: |
          git config user.name "tender-radar-bot"
          git config user.email "tender-radar-bot@users.noreply.github.com"
          git add site/prospects.json
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Leads weekly refresh: $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- fetching and rebasing."
            git fetch origin main
            git rebase origin/main -X ours
            sleep 5
          done
          echo "Still couldn't push after 5 attempts."
          exit 1
