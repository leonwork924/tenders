name: fetch tenders

on:
  schedule:
    # GitHub explicitly warns that round times (:00, :15, :30, :45) are the
    # most likely to be delayed or dropped under load -- these two odd
    # minutes, ~8h apart, make a full silent miss much less likely.
    - cron: "37 6 * * *"
    - cron: "22 14 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed to commit data/tenders.sqlite3 and site/data.json back

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, score, export
        run: python run.py fetch

      - name: Commit updated data
        run: |
          git config user.name "tender-radar-bot"
          git config user.email "tender-radar-bot@users.noreply.github.com"
          git add data/tenders.sqlite3 site/data.json
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Daily fetch: $(date -u +%Y-%m-%d)"

          # The remote can move between checkout and this step (a manual
          # push, or the other scheduled run landing first) -- these two
          # files are always a full regenerated snapshot, so on conflict
          # this run's version is the correct one to keep. Retry a few
          # times rather than failing the whole job over a race.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- fetching and rebasing."
            git fetch origin main
            git rebase origin/main -X ours
            sleep 5
          done
          echo "Still couldn't push after 5 attempts."
          exit 1
