name: extract diplomats

on:
  schedule:
    # Hebdomadaire (les listes diplomatiques changent rarement) -- minute
    # décalée comme pour fetch.yml pour éviter la congestion du scheduler.
    - cron: "11 5 * * 0"   # dimanche 05:11 UTC
  workflow_dispatch: {}    # pour lancer le premier run à la main depuis l'onglet Actions

permissions:
  contents: write   # nécessaire pour committer les fichiers générés

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r diplomats/requirements.txt

      - name: Combine main + consular sources
        run: |
          python diplomats/src/combine_sources.py \
            --sources diplomats/data/sources.json \
            --consular diplomats/data/consular_sources_seed.json \
            --out diplomats/data/sources_combined.json

      - name: Scrape official diplomatic + honorary consul lists
        run: |
          python diplomats/src/agent.py \
            --sources diplomats/data/sources_combined.json \
            --out diplomats/data/diplomats.json

      - name: Query Wikidata (complément)
        run: |
          python diplomats/src/wikidata_source.py \
            --sources diplomats/data/sources_combined.json \
            --out diplomats/data/diplomats_wikidata.json

      - name: International organizations (UN / AU / OSCE)
        run: |
          python diplomats/src/org_delegations.py \
            --org all \
            --out diplomats/data/org_delegations.json

      - name: Merge sources
        run: |
          python diplomats/src/merge_sources.py \
            --scraped diplomats/data/diplomats.json \
            --wikidata diplomats/data/diplomats_wikidata.json \
            --org diplomats/data/org_delegations.json \
            --out diplomats/data/diplomats_merged.json

      - name: Export to site/contact.json
        run: |
          python diplomats/src/export_site.py \
            --sources diplomats/data/sources_combined.json \
            --merged diplomats/data/diplomats_merged.json \
            --org diplomats/data/org_delegations.json \
            --out site/contact.json

      - name: Commit updated data
        run: |
          git config user.name "tender-radar-bot"
          git config user.email "tender-radar-bot@users.noreply.github.com"
          git add diplomats/data/sources_combined.json diplomats/data/diplomats.json diplomats/data/diplomats_wikidata.json diplomats/data/org_delegations.json diplomats/data/diplomats_merged.json site/contact.json
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Diplomats weekly refresh: $(date -u +%Y-%m-%d)"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- fetching and rebasing."
            git fetch origin main
            git rebase origin/main -X ours
            sleep 5
          done
          echo "Still couldn't push after 5 attempts."
          exit 1
