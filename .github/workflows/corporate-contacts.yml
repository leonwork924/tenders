name: corporate contacts (lookup)

# Recherche ciblée d'une entreprise à la fois (registre national + LEI GLEIF,
# + Hunter.io si un domaine est fourni). Remplace l'ancien mode "discovery
# global" (GLEIF Golden Copy complet, ~plusieurs millions d'entités, 5h de
# timeout) qui n'avait jamais produit de résultat exploitable -- voir
# corporate/README.md pour le détail.
#
# Se lance à la main depuis l'onglet Actions : bouton "Run workflow", puis
# remplir company_name (obligatoire), country et domain (optionnels).

on:
  workflow_dispatch:
    inputs:
      company_name:
        description: "Nom de l'entreprise"
        required: true
      country:
        description: "Code pays ISO à 2 lettres (ex: FR, GB, NO, SG, BE) -- laisser vide pour recherche via OpenCorporates"
        required: false
      domain:
        description: "Nom de domaine (ex: danone.com) -- laisser vide tant que HUNTER_API_KEY n'est pas configuré"
        required: false

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r corporate/requirements.txt

      - name: Run targeted lookup
        env:
          OPENCORPORATES_API_KEY: ${{ secrets.OPENCORPORATES_API_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
        run: |
          cd corporate/data
          ARGS=(--name "${{ inputs.company_name }}")
          if [ -n "${{ inputs.country }}" ]; then ARGS+=(--country "${{ inputs.country }}"); fi
          if [ -n "${{ inputs.domain }}" ]; then ARGS+=(--domain "${{ inputs.domain }}"); fi
          python ../src/agent_corporate_contacts_v8.py "${ARGS[@]}"

      - name: Export site/corporate_contacts.json
        run: python corporate/src/export_site.py --db corporate/data/corporate_contacts.db --out site/corporate_contacts.json

      - name: Commit updated data
        run: |
          git config user.name "tender-radar-bot"
          git config user.email "tender-radar-bot@users.noreply.github.com"
          git add corporate/data/corporate_contacts.db site/corporate_contacts.json
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Corporate contacts: ${{ inputs.company_name }}"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- fetching and rebasing."
            git fetch origin main
            git rebase origin/main -X ours
            sleep 5
          done
          echo "Still couldn't push after 5 attempts."
          exit 1
